name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Run tests
        run: go test ./...

      - name: Build release binary
        run: go build -ldflags="-s -w" -o filemaid ./cmd/filemaid

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}" ./filemaid
          --title "filemaid ${{ github.ref_name }}"
          --generate-notes
