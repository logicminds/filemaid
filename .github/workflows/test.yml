name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        go-version: ["1.23", "1.24"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: go build -o bin/filemaid ./cmd/filemaid

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Enforce coverage gate
        run: go tool cover -func=coverage.out | awk 'END {print $3}' | sed 's/%//' | awk '{if ($1 < 80) {print "coverage " $1 "% below 80%"; exit 1} print "coverage " $1 "% ok"}'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.go-version }}
          path: coverage.out
          if-no-files-found: ignore

  lint:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      - name: Build binary
        run: go build ./cmd/filemaid

      - name: Validate JSON configs and generated launchd plists
        run: |
          go run ./cmd/filemaid config > /dev/null
          go test ./internal/setup/... -run TestRenderPlists

  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build release binary
        run: go build -ldflags="-s -w" -o filemaid ./cmd/filemaid

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: filemaid-macos-binary
          path: filemaid
          if-no-files-found: error
