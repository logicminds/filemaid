[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "filemaid"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
filemaid = "filemaid.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["filemaid*"]
