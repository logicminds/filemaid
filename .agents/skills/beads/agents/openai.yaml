interface:
  display_name: "Beads"
  short_description: "Project task tracking with bd"
  default_prompt: "Use $beads to inspect ready work and manage durable project tasks. Always create a git branch for bead work, group logically related tasks on the same branch, commit code, run tests/lints/builds, run skill:ce-simplify-code on the branch diff, push the branch, open a pull request, and only then close the bead task."
